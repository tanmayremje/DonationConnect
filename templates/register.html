{% extends "base.html" %}

{% block content %}

<div class="form-container">

    <div class="form-card">

        <h1>
            Create Account
        </h1>

        <form method="POST">

            <label>
                Full Name
            </label>

            <input
                type="text"
                name="name"
                placeholder="Enter your name"
                required>


            <label>
                Email
            </label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required>


            <label>
                Mobile Number
            </label>

            <input
                type="text"
                name="mobile"
                placeholder="Enter mobile number"
                required>


            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Create password"
                required>


            <label>
                Register As
            </label>

            <select name="role" required>

                <option value="">
                    Select role
                </option>

                <option value="donor">
                    Donor
                </option>

                <option value="acceptor">
                    Acceptor
                </option>

            </select>


            <label>
                Location / Address
            </label>

            <input
                type="text"
                name="location"
                placeholder="Example: Virar, Maharashtra"
                required>


            <button
                type="submit"
                class="btn primary full">
                Create Account
            </button>

        </form>

        <p class="form-bottom">

            Already have an account?

            <a href="{{ url_for('login') }}">
                Login
            </a>

        </p>

    </div>

</div>

{% endblock %}
