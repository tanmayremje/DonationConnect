{% extends "base.html" %}

{% block content %}

<div class="form-container">

    <div class="form-card">

        <h1>
            Welcome Back
        </h1>

        <p>
            Login to your DonationConnect account.
        </p>

        <form method="POST">

            <label>
                Email
            </label>

            <input
                type="email"
                name="email"
                placeholder="Enter email"
                required>


            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required>


            <button
                type="submit"
                class="btn primary full">
                Login
            </button>

        </form>

        <p class="form-bottom">

            Don't have an account?

            <a href="{{ url_for('register') }}">
                Register
            </a>

        </p>

    </div>

</div>

{% endblock %}
